name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Dunnit-${{ github.ref_name }}-linux.tar.xz
          - os: macos-latest
            artifact: Dunnit-${{ github.ref_name }}-macos.zip
          - os: windows-latest
            artifact: Dunnit-${{ github.ref_name }}-windows.zip

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux Fyne dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dev libwayland-dev libxkbcommon-dev xorg-dev

      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mingw --no-progress --yes

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.2

      - name: Build and test
        run: |
          go build -o dunnit .
          go vet ./...

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          fyne package -os linux -name Dunnit -icon Icon.png -appVersion "$APP_VERSION" -release
          mv Dunnit.tar.xz "${{ matrix.artifact }}"

      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64" || { echo "Missing APPLE_CERTIFICATE_P12_BASE64"; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "Missing APPLE_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$APPLE_SIGNING_IDENTITY" || { echo "Missing APPLE_SIGNING_IDENTITY"; exit 1; }
          test -n "$APPLE_ID" || { echo "Missing APPLE_ID"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID"; exit 1; }
          test -n "$APPLE_APP_PASSWORD" || { echo "Missing APPLE_APP_PASSWORD"; exit 1; }

          APP_VERSION="${GITHUB_REF_NAME#v}"
          fyne package -os darwin -name Dunnit -icon Icon.png -appVersion "$APP_VERSION" -release

          KEYCHAIN_PATH="$RUNNER_TEMP/dunnit-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 8)"
          CERTIFICATE_PATH="$RUNNER_TEMP/dunnit-signing.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" Dunnit.app
          codesign --verify --deep --strict --verbose=2 Dunnit.app

          NOTARIZE_ZIP="$RUNNER_TEMP/Dunnit-notarize.zip"
          ditto -c -k --keepParent Dunnit.app "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple Dunnit.app
          xcrun stapler validate Dunnit.app
          ditto -c -k --keepParent Dunnit.app "${{ matrix.artifact }}"

      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/dunnit-signing.keychain-db" || true

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          fyne package -os windows -name Dunnit -icon Icon.png -appID com.micahelliott.dunnit -appVersion $appVersion -release
          Compress-Archive -Path Dunnit.exe -DestinationPath "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
